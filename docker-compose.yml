# 로컬 개발용 Postgres. 앱 자체는 호스트에서 uv 로 실행한다.
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: mathknot-db
    environment:
      POSTGRES_USER: mathknot
      POSTGRES_PASSWORD: mathknot
      POSTGRES_DB: mathknot
    ports:
      - "5432:5432"
    volumes:
      - mathknot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathknot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mathknot-pgdata:
